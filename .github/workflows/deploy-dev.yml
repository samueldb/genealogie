name: Deploy genealogy preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genealogie-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Check site and test data routing
        run: |
          npm run check
          npm test

      - name: Publish preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          destination_dir: preview-site
          # Replace only this subdirectory, including removal of legacy files.
          keep_files: false
          commit_message: "Deploy dev preview: ${{ github.sha }}"
