name: Deploy dev preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install


      - name: Assemble preview bundle
        run: |
          mkdir -p preview-site
          cp -R deschampsberger preview-site/deschampsberger
          cp -R index preview-site/index
          cp -R styles preview-site/styles
          cp -R dist preview-site/dist
          cp -R includes preview-site/includes
          cp -R utils preview-site/utils
          cp data_db.json preview-site/data_db.json
          cp index.html preview-site/index.html

      - name: Build project
        run: npm run build

      - name: Publish preview to gh-pages-dev
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages-dev
          publish_dir: preview-site
          commit_message: "Deploy dev preview: ${{ github.sha }}"
