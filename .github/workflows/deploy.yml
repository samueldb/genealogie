name: Deploy genealogy site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Both workflows update gh-pages; serialize them to preserve the other site.
concurrency:
  group: genealogie-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Check site and test data routing
        run: |
          npm run check
          npm test

      - name: Prepare GitHub Pages bundle
        run: |
          mkdir -p public-site
          cp -R site/. public-site/

      - name: Preserve existing preview
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages
            if git cat-file -e FETCH_HEAD:preview-site 2>/dev/null; then
              git archive FETCH_HEAD preview-site | tar -x -C public-site
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public-site
          keep_files: false
