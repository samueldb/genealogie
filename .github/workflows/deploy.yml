name: Deploy Deschampsberger site

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for source directory
        id: src-check
        run: |
          if [ -d src ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: ${{ steps.src-check.outputs.found == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        if: ${{ steps.src-check.outputs.found == 'true' }}
        run: npm install

      - name: Build library
        if: ${{ steps.src-check.outputs.found == 'true' }}
        run: npm run build

      - name: Prepare GitHub Pages bundle
        run: |
          mkdir -p public-site
          cp -R deschampsberger public-site/deschampsberger
          cp -R index public-site/index
          cp -R styles public-site/styles
          cp -R dist public-site/dist
          cp -R includes public-site/includes
          cp -R utils public-site/utils
          cp data_db.json public-site/data_db.json
          cp index.html public-site/index.html

      - name: Restore current preview-site bundle
        run: |
          if git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" gh-pages-current; then
            if [ -d gh-pages-current/preview-site ]; then
              rm -rf public-site/preview-site
              cp -R gh-pages-current/preview-site public-site/preview-site
            fi
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public-site
