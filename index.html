<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Deschamps Berger Family tree</title>
    <script src="https://unpkg.com/d3@7"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js"
            integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script type="module" src="https://unpkg.com/family-chart@0.9.0"></script>
    <link rel="stylesheet" href="https://unpkg.com/family-chart@0.9.0/dist/styles/family-chart.css">
    <link rel="stylesheet" href="styles/family-chart.css">
    <link rel="stylesheet" type="text/css" href="styles/decorum.css">
    <link rel="stylesheet" href="styles/site.css">
    <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script>
        window.GENEA_API_CONFIG = window.GENEA_API_CONFIG || {
            baseUrl: "https://genealogie.onrender.com",
            apiKey: "mon_token_pour_ajouter_des_personnes_pls_dont_hack"
        };
    </script>
</head>
<body>
<header id="header"></header>
  <div id="menu"></div>
  <div id="content-wrapper">
      <div class="inner clearfix">
          <section id="main-content">
              <div class="timeline-layout">
                  <div id="TimelineContainer" class="timeline-panel" aria-hidden="true">
                      <div class="timeline-panel__header">
                          <div class="timeline-panel__title">Frise chronologique</div>
                          <div class="timeline-panel__subtitle">Nombre de personnes référencées vivantes à cette époque</div>
                      </div>
                      <svg id="TimelineSvg" class="timeline-svg" role="presentation"></svg>
                  </div>
                  <div id="FamilyChart" class="f3" style="width:100%;margin:auto;background-color:rgba(250,250,250,1);color:#fff;"></div>
              </div>
          </section>
          <aside id="sidebar">
              <div id="RecherchePersonne"></div>
              <div id="EditPanel">
                  <div id="EditPanelFormHost"></div>
                <div id="SaveDataStatus" class="save-status" aria-live="polite"></div>
            </div>
            Légende
            <div id="sideTooltip"></div>
        </aside>
    </div>
</div>
<script>
    $(function () {
      $("#header").load("includes/header.html");
      $("#menu").load("includes/menu.html");
    });
</script>
<script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
<script src="index/index.js" type="module"></script>
</body>
</html>
