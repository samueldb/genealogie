<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>my-family-chart</title>
  <script src="https://unpkg.com/d3@7"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.js"
            integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
  <script type="module" src="https://unpkg.com/family-chart@0.9.0"></script>
  <link rel="stylesheet" href="../styles/family-chart.css">
  <link rel="stylesheet" href="https://unpkg.com/family-chart@0.9.0/dist/styles/family-chart.css">

    <link rel="stylesheet" type="text/css" href="/styles/decorum.css">
    <style>
        body { font-family: 'Arial', sans-serif; }
        #sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        #EditPanel {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        #EditPanelFormHost .f3-form-cont {
            width: 100%;
            height: auto;
            box-shadow: none;
        }
        #EditPanelFormHost .f3-form-cont.opened {
            width: 100%;
        }
        .save-status {
            font-size: 0.85rem;
            color: #333;
            min-height: 1.2rem;
        }
        .save-status.saving {
            color: #444;
        }
        .save-status.error {
            color: #a94442;
        }
        .save-status.success {
            color: #007c48;
        }
        #EditPanel .lastname-suggestions {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 4px;
            max-height: 180px;
            overflow-y: auto;
            display: none;
            position: relative;
            z-index: 5;
        }
        #EditPanel .lastname-suggestions div {
            padding: 4px 8px;
            cursor: pointer;
        }
        #EditPanel .lastname-suggestions div:hover {
            background: #f0f0f0;
        }
        #RecherchePersonne .search-card {
            background: linear-gradient(135deg, #0f172a, #1d3557);
            color: #e8eefc;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 14px 40px rgba(12, 21, 39, 0.35);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #RecherchePersonne .search-card__header {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #RecherchePersonne .search-card__eyebrow {
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(232, 238, 252, 0.7);
        }
        #RecherchePersonne .search-card__title {
            font-size: 1.05rem;
            font-weight: 700;
        }
        #RecherchePersonne .search-card__subtitle {
            font-size: 0.9rem;
            color: rgba(232, 238, 252, 0.8);
        }
        #RecherchePersonne .search-card__input-row {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 120ms ease, background 120ms ease;
        }
        #RecherchePersonne .search-card__input-row:focus-within {
            border-color: rgba(142, 211, 150, 0.9);
            background: rgba(255, 255, 255, 0.12);
        }
        #RecherchePersonne .search-card__icon {
            font-size: 1rem;
            opacity: 0.8;
        }
        #RecherchePersonne .search-card__icon svg {
            display: block;
            width: 18px;
            height: 18px;
        }
        #RecherchePersonne input#SearchPersonInput {
            flex: 1;
            background: transparent;
            border: none;
            color: #e8eefc;
            font-size: 0.95rem;
            outline: none;
        }
        #RecherchePersonne .search-card__clear {
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: #e8eefc;
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
            transition: background 120ms ease, transform 120ms ease;
        }
        #RecherchePersonne .search-card__clear:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        #RecherchePersonne .search-card__meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: rgba(232, 238, 252, 0.8);
        }
        #RecherchePersonne .search-card__dropdown {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: rgba(13, 23, 41, 0.9);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
        }
        #RecherchePersonne .search-card__option {
            text-align: left;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: #e8eefc;
            cursor: pointer;
            transition: background 100ms ease;
        }
        #RecherchePersonne .search-card__option:hover,
        #RecherchePersonne .search-card__option:focus {
            background: rgba(142, 211, 150, 0.18);
        }
        #RecherchePersonne .search-card__empty {
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(232, 238, 252, 0.78);
            font-size: 0.9rem;
        }
        #RecherchePersonne .is-hidden {
            display: none;
        }
        .person-media {
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            padding: 10px;
        }
        .person-media__preview {
            background: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }
        .person-media__preview img {
            width: 100%;
            max-height: 210px;
            object-fit: cover;
            border-radius: 6px;
        }
        .person-media__actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #2f3546;
        }
        .person-media__upload {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            background: #0f172a;
            color: #e8eefc;
            font-weight: 600;
        }
        .person-media__upload input {
            display: none;
        }
        .person-media__hint {
            color: #4b5563;
            font-size: 0.85rem;
        }
        .person-map {
            margin-top: 12px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
            color: #e8eefc;
        }
        .person-map__header {
            padding: 10px 12px 0 12px;
        }
        .person-map__title {
            font-weight: 700;
        }
        .person-map__subtitle {
            font-size: 0.9rem;
            color: rgba(232, 238, 252, 0.8);
        }
        .person-map__canvas {
            height: 220px;
        }
        .person-map__footer {
            padding: 6px 12px 10px 12px;
            font-size: 0.85rem;
            color: rgba(232, 238, 252, 0.78);
        }
        .person-map .leaflet-control-container .leaflet-top {
            top: 12px;
        }
        .visually-hidden {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
        /* Family form header */
        #familyForm .person-form-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
        }
        #familyForm .person-form-header__avatar .person-media {
            margin-top: 0;
        }
        #familyForm .person-form-header__avatar .person-media__preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
        }
        #familyForm .person-form-header__details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px 12px;
            width: 100%;
        }
        #familyForm .person-form-header__details .f3-form-field,
        #familyForm .person-form-header__details .f3-info-field {
            margin: 0;
        }
        #familyForm .person-form-header__avatar {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #familyForm .person-form-header__avatar .avatar-field-wrapper {
            margin: 0;
        }
        /* Card layout tweaks */
        .f3 div.card-image-rect {
            width: 200px;
            min-height: 70px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 10px;
            padding: 8px;
            border-radius: 5px;
        }
        .f3 div.card-image-rect .person-icon,
        .f3 div.card-image-rect img {
            height: 70px;
            width: 70px;
            object-fit: cover;
            flex: 0 0 auto;
            padding: 5px;
            border-radius: 8px;
        }
        .f3 div.card-image-rect svg {
            object-fit: cover;
            width: 100%;
            height: 100%;
            padding: 5px;
            border-radius: 7px;
        }
        .f3 div.card-image-rect div.card-label {
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 2px;
            text-align: left;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
<header id="header"></header>
<div id="menu"></div>
<div id="content-wrapper">
    <div class="inner clearfix">
        <section id="main-content">
            <div id="FamilyChart" class="f3" style="width:100%;height:600px;margin:auto;background-color:rgba(250,250,250,1);color:#fff;"></div>
        </section>
        <aside id="sidebar">
            <div id="RecherchePersonne"></div>
            <div id="EditPanel">
                <div id="EditPanelFormHost"></div>
                <div id="SaveDataStatus" class="save-status" aria-live="polite"></div>
            </div>
            Légende
            <div id="sideTooltip"></div>
        </aside>
    </div>
</div>
<script>
    $(function () {
      $("#header").load("/deschampsberger/includes/header.html");
      $("#menu").load("/deschampsberger/includes/menu.html");
    });
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j7k9RRTHEUttuPAHyx+K6TfGs3MXf3Z8aQhrv28=" crossorigin=""></script>
<script src="index.js" type="module"></script>
</body>
</html>
